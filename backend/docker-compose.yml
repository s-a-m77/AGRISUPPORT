services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agrisupport
    ports:
      - "5432:5432"
    volumes:
      - agrisupport-postgres:/var/lib/postgresql/data

volumes:
  agrisupport-postgres:
